<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus ERP Pro | Plataforma Contable y Auditoría Empresarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para Gráficas Dinámicas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#060911',
                        cardbg: '#0f1623',
                        cardborder: '#1e293b',
                        accent: '#38bdf8',
                        accenthover: '#0284c7'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- PANTALLA DE AUTENTICACIÓN -->

                    <i class="fa-solid fa-scale-balanced text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-wide text-white">NEXUS <span class="text-accent">ERP PRO</span></h1>

            </div>

                <button onclick="switchAuthView('register')" id="tab-register" class="py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Crear Cuenta</button>
            </div>

            <div class="space-y-4">
                <div id="view-login" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="usuario@empresa.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Contraseña</label>
                        <input type="password" id="login-pass" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-500">Acceso Seguro SSL</span>
                        <button onclick="switchAuthView('recover')" class="text-accent hover:underline">¿Olvidaste tu contraseña?</button>
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-accent hover:bg-accenthover text-darkbg font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-accent/20">
                        Entrar al Sistema
                    </button>
                </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nombre de Usuario</label>
                        <input type="text" id="reg-username" placeholder="Tu Nombre" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nombre de la Empresa o Despacho</label>
                        <input type="text" id="reg-company" placeholder="Ej: Inversiones Duarte S.A." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Correo Electrónico Válido</label>
                        <input type="email" id="reg-email" placeholder="correo@dominio.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
